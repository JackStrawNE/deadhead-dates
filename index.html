<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dead Dates</title>
    <meta name="description" content="Pick a Grateful Dead show date and find the tapes, ranked by a Fire score.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Dead Dates">
  <meta property="og:description" content="Pick a show date. Find the tapes, ranked by Fire score.">
  <meta property="og:url" content="https://deaddates.com/">
  <meta property="og:image" content="https://deaddates.com/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body>
  <div class="container">
    <h1>Dead Dates</h1>
    <p class="tagline">Pick a show date. Find the tapes.</p>

    <div class="search-row">
      <label for="show-date">Single show</label>
      <input type="date" id="show-date" value="1977-05-08">
      <button id="date-btn">Search date</button>
    </div>

    <div class="search-row">
      <label for="show-year">Whole year</label>
      <select id="show-year"></select>
      <button id="year-btn">Browse year</button>
    </div>

    <div class="today-row">
      <button id="today-btn" class="link-btn">Shows on this date</button>
    </div>

    <div class="filter-row">
      <button class="filter-btn active" data-filter="ALL">All</button>
      <button class="filter-btn" data-filter="SBD">SBD</button>
      <button class="filter-btn" data-filter="AUD">AUD</button>
      <button class="filter-btn" data-filter="MTX">MTX</button>
    </div>

    <p id="status"></p>

    <div class="copy-row">
      <button id="copy-btn" class="link-btn" hidden>🔗 Copy link to these results</button>
    </div>

    <ul id="results"></ul>
  </div>

  <script>
    const dateInput = document.getElementById('show-date');
    const yearSelect = document.getElementById('show-year');
    const dateBtn = document.getElementById('date-btn');
    const yearBtn = document.getElementById('year-btn');
    const todayBtn = document.getElementById('today-btn');
    const statusText = document.getElementById('status');
    const resultsList = document.getElementById('results');
    const filterButtons = document.querySelectorAll('.filter-btn');
    const copyBtn = document.getElementById('copy-btn');

    const COPY_LABEL = '🔗 Copy link to these results';

    // State: which filter is active, and what the last search returned
    let currentFilter = 'ALL';
    let lastSearch = null;

    // If set, the next render highlights and scrolls to this recording
    let highlightId = null;

    // Label the "this date" button with today's month and day
    todayBtn.textContent = '📅 Shows on this date (' +
      new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric' }) + ')';

    // Fill the year dropdown (the Dead toured 1965 to 1995)
    for (let year = 1965; year <= 1995; year++) {
      const option = document.createElement('option');
      option.value = year;
      option.textContent = year;
      yearSelect.appendChild(option);
    }
    yearSelect.value = '1977';

    // Turn 5 into "05"
    function pad(n) {
      return String(n).padStart(2, '0');
    }

    // Copy text to the clipboard, with a brief confirmation on the button
    async function copyText(text, button, doneLabel, normalLabel) {
      try {
        await navigator.clipboard.writeText(text);
        button.textContent = doneLabel;
      } catch (error) {
        window.prompt('Copy this link:', text);
      }
      setTimeout(() => { button.textContent = normalLabel; }, 2000);
    }

    // Combine views and ratings into one "Fire" score
    function fireScore(rec) {
      const downloads = Number(rec.downloads) || 0;
      const rating = Number(rec.avg_rating) || 0;
      const reviews = Number(rec.num_reviews) || 0;

      const PRIOR_RATING = 3.5;  // assumed rating when we know little
      const PRIOR_WEIGHT = 3;    // how many "phantom reviews" at that rating

      const adjustedRating =
        (rating * reviews + PRIOR_RATING * PRIOR_WEIGHT) / (reviews + PRIOR_WEIGHT);

      return Math.log10(downloads + 1) * adjustedRating;
    }

    // Guess the recording type from naming conventions
    function detectSource(rec) {
      const text = [rec.identifier, rec.title, rec.source]
        .map(part => String(part || ''))
        .join(' ')
        .toLowerCase();

      if (/(^|[^a-z])mtx([^a-z]|$)|matrix/.test(text)) return 'MTX';
      if (/(^|[^a-z])sbd([^a-z]|$)|soundboard/.test(text)) return 'SBD';
      if (/(^|[^a-z])aud([^a-z]|$)|audience/.test(text)) return 'AUD';
      return null;
    }

    // Ask Archive.org for recordings matching a query
    async function fetchRecordings(query) {
      const url = 'https://archive.org/advancedsearch.php?q=' +
        encodeURIComponent(query) +
        '&fl[]=identifier&fl[]=title&fl[]=date&fl[]=downloads&fl[]=avg_rating&fl[]=num_reviews&fl[]=source&rows=2000&output=json';

      const response = await fetch(url);
      if (!response.ok) {
        throw new Error('Archive.org returned status ' + response.status);
      }
      const data = await response.json();
      const docs = data.response.docs;

      for (const rec of docs) {
        rec.fire = fireScore(rec);
        rec.sourceType = detectSource(rec);
      }
      docs.sort((a, b) => b.fire - a.fire);
      return docs;
    }

    // A Dead Dates link that opens this show with this recording highlighted
    function recordingShareUrl(rec) {
      const day = rec.date ? rec.date.slice(0, 10) : '';
      if (!/^\d{4}-\d{2}-\d{2}$/.test(day)) {
        // No usable show date, so fall back to the plain Archive.org page
        return 'https://archive.org/details/' + rec.identifier;
      }
      const params = new URLSearchParams({ date: day, rec: rec.identifier });
      const base = window.location.href.split('?')[0].split('#')[0];
      return base + '?' + params.toString();
    }

    // Build one clickable <li> for a recording
    function makeRecordingItem(rec) {
      const item = document.createElement('li');
      item.className = 'rec-item';
      item.dataset.identifier = rec.identifier;

      const link = document.createElement('a');
      link.href = 'https://archive.org/details/' + rec.identifier;
      link.target = '_blank';

      const title = document.createElement('span');
      if (rec.sourceType) {
        const tag = document.createElement('span');
        tag.className = 'tag tag-' + rec.sourceType.toLowerCase();
        tag.textContent = rec.sourceType;
        title.appendChild(tag);
      }
      title.appendChild(document.createTextNode(rec.title || rec.identifier));
      link.appendChild(title);

      const stats = document.createElement('span');
      stats.className = 'views';
      const ratingText = rec.num_reviews
        ? ` · ★ ${Number(rec.avg_rating).toFixed(1)} (${rec.num_reviews})`
        : '';
      stats.textContent =
        `🔥 ${rec.fire.toFixed(1)} · ${(Number(rec.downloads) || 0).toLocaleString()} views` +
        ratingText;
      link.appendChild(stats);

      const shareBtn = document.createElement('button');
      shareBtn.type = 'button';
      shareBtn.className = 'copy-rec';
      shareBtn.textContent = '🔗';
      shareBtn.title = 'Copy a link to this recording';
      shareBtn.setAttribute('aria-label', 'Copy a link to this recording');
      shareBtn.addEventListener('click', () => {
        copyText(recordingShareUrl(rec), shareBtn, '✔', '🔗');
      });

      item.appendChild(link);
      item.appendChild(shareBtn);
      return item;
    }

    // Turn "1977-05-08" into "Sun, May 8, 1977"
    function formatDate(isoDate) {
      const [y, m, d] = isoDate.split('-').map(Number);
      return new Date(y, m - 1, d).toLocaleDateString('en-US', {
        weekday: 'short', year: 'numeric', month: 'long', day: 'numeric'
      });
    }

    // Build a YouTube search URL like "Grateful Dead 5/8/77"
    function youtubeSearchUrl(isoDate) {
      const [y, m, d] = isoDate.split('-').map(Number);
      const shortYear = String(y).slice(-2);
      const query = `Grateful Dead ${m}/${d}/${shortYear}`;
      return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(query);
    }

    // Build the YouTube link row
    function makeYouTubeItem(isoDate) {
      const item = document.createElement('li');
      item.className = 'youtube-item';
      const link = document.createElement('a');
      link.href = youtubeSearchUrl(isoDate);
      link.target = '_blank';
      link.rel = 'noopener';
      link.textContent = '▶ Find this show on YouTube';
      item.appendChild(link);
      return item;
    }

    // Build a shareable URL for the current search and filter
    function buildShareUrl() {
      const params = new URLSearchParams(lastSearch.params);
      if (currentFilter !== 'ALL') params.set('filter', currentFilter);
      const base = window.location.href.split('?')[0].split('#')[0];
      return base + '?' + params.toString();
    }

    // Put the current search into the address bar (without reloading)
    function updateUrl() {
      try {
        history.replaceState(null, '', buildShareUrl());
      } catch (error) {
        // Some environments (like files opened straight from disk) block this
      }
    }

    // Update the filter buttons (highlight, counts) and the copy-link button
    function updateControls() {
      const counts = { ALL: 0, SBD: 0, AUD: 0, MTX: 0 };
      if (lastSearch) {
        counts.ALL = lastSearch.recordings.length;
        for (const rec of lastSearch.recordings) {
          if (rec.sourceType) counts[rec.sourceType]++;
        }
      }

      for (const btn of filterButtons) {
        const type = btn.dataset.filter;
        const label = type === 'ALL' ? 'All' : type;
        btn.textContent = lastSearch ? `${label} · ${counts[type]}` : label;
        btn.classList.toggle('active', type === currentFilter);
      }

      copyBtn.hidden = !lastSearch;
    }

    // If a link pointed at a specific recording, highlight it and scroll to it
    function highlightRecording() {
      if (!highlightId) return;

      const target = resultsList.querySelector(
        '[data-identifier="' + CSS.escape(highlightId) + '"]'
      );
      highlightId = null;

      if (!target) {
        statusText.textContent += ' (The linked recording was not found.)';
        return;
      }

      const details = target.closest('details');
      if (details) details.open = true;

      target.classList.add('highlight');
      target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // Draw the stored search results, applying the current filter
    function renderResults() {
      resultsList.innerHTML = '';
      if (!lastSearch) return;

      updateUrl();

      const { mode, recordings, year, date } = lastSearch;
      const visible = currentFilter === 'ALL'
        ? recordings
        : recordings.filter(rec => rec.sourceType === currentFilter);
      const filterNote = currentFilter === 'ALL' ? '' : ` (${currentFilter} only)`;

      if (mode === 'date') {
        resultsList.appendChild(makeYouTubeItem(date));

        if (recordings.length === 0) {
          statusText.textContent = 'No recordings found for that date.';
          highlightId = null;
          return;
        }

        if (visible.length === 0) {
          statusText.textContent = `No ${currentFilter} recordings for that date.`;
          highlightId = null;
          return;
        }

        statusText.textContent = `Found ${visible.length} recording(s)${filterNote}:`;
        for (const rec of visible) {
          resultsList.appendChild(makeRecordingItem(rec));
        }
        highlightRecording();
        return;
      }

      // Year mode: group the visible recordings by show date
      const shows = {};
      for (const rec of visible) {
        if (!rec.date) continue;
        const day = rec.date.slice(0, 10);
        if (!/^\d{4}-\d{2}-\d{2}$/.test(day)) continue;
        if (!shows[day]) shows[day] = [];
        shows[day].push(rec);
      }

      const days = Object.keys(shows).sort();

      if (days.length === 0) {
        statusText.textContent = recordings.length === 0
          ? `No recordings found for ${year}.`
          : `No ${currentFilter} recordings found for ${year}.`;
        return;
      }

      statusText.textContent =
        `${year}: ${days.length} shows, ${visible.length} recordings${filterNote}`;

      for (const day of days) {
        const recs = shows[day];
        const item = document.createElement('li');
        const details = document.createElement('details');
        const summary = document.createElement('summary');
        const list = document.createElement('ul');
        list.className = 'recording-list';

        summary.textContent = formatDate(day) + ' · ' + recs.length +
          (recs.length === 1 ? ' recording' : ' recordings');

        list.appendChild(makeYouTubeItem(day));

        for (const rec of recs) {
          list.appendChild(makeRecordingItem(rec));
        }

        details.appendChild(summary);
        details.appendChild(list);
        item.appendChild(details);
        resultsList.appendChild(item);
      }
    }

    async function searchDate() {
      const date = dateInput.value;
      if (!date) {
        statusText.textContent = 'Pick a date first.';
        return;
      }

      statusText.textContent = 'Searching...';
      resultsList.innerHTML = '';
      lastSearch = null;
      updateControls();

      try {
        const recordings = await fetchRecordings(
          `collection:GratefulDead AND date:${date}`
        );
        lastSearch = { mode: 'date', recordings, date, params: { date } };
        updateControls();
        renderResults();
      } catch (error) {
        statusText.textContent = 'Something went wrong. Check the console (F12).';
        console.error(error);
      }
    }

    async function searchYear() {
      const year = yearSelect.value;

      statusText.textContent = 'Searching...';
      resultsList.innerHTML = '';
      lastSearch = null;
      updateControls();

      try {
        const recordings = await fetchRecordings(
          `collection:GratefulDead AND year:${year}`
        );
        lastSearch = { mode: 'year', recordings, year, params: { year } };
        updateControls();
        renderResults();
      } catch (error) {
        statusText.textContent = 'Something went wrong. Check the console (F12).';
        console.error(error);
      }
    }

    // Shows on one calendar day (like 10-20) across every year
    async function searchThisDate(month, day) {
      const label = new Date(2000, Number(month) - 1, Number(day))
        .toLocaleDateString('en-US', { month: 'long', day: 'numeric' });

      statusText.textContent = 'Searching...';
      resultsList.innerHTML = '';
      lastSearch = null;
      updateControls();

      // One query covering this month and day in every year the band toured
      const dates = [];
      for (let year = 1965; year <= 1995; year++) {
        dates.push(`date:${year}-${month}-${day}`);
      }

      try {
        const recordings = await fetchRecordings(
          `collection:GratefulDead AND (${dates.join(' OR ')})`
        );
        lastSearch = {
          mode: 'year',
          recordings,
          year: label,
          params: { day: `${month}-${day}` }
        };
        updateControls();
        renderResults();
      } catch (error) {
        statusText.textContent = 'Something went wrong. Check the console (F12).';
        console.error(error);
      }
    }

    // If the page was opened from a shared link, run that search
    function loadFromUrl() {
      const params = new URLSearchParams(window.location.search);

      const date = params.get('date');
      const year = params.get('year');
      const day = params.get('day');
      const recId = params.get('rec');
      const filter = params.get('filter');

      // A link to a specific recording ignores the filter, so it can't hide it
      const hasRec = recId && /^[\w.-]+$/.test(recId);
      if (!hasRec && ['SBD', 'AUD', 'MTX'].includes(filter)) {
        currentFilter = filter;
      }

      // Check each value looks right before using it
      if (date && /^\d{4}-\d{2}-\d{2}$/.test(date)) {
        dateInput.value = date;
        if (hasRec) highlightId = recId;
        searchDate();
      } else if (year && /^\d{4}$/.test(year)) {
        yearSelect.value = year;
        if (yearSelect.value === year) searchYear();
      } else if (day && /^\d{2}-\d{2}$/.test(day)) {
        const [month, dayOfMonth] = day.split('-');
        searchThisDate(month, dayOfMonth);
      }
    }

    dateBtn.addEventListener('click', searchDate);
    yearBtn.addEventListener('click', searchYear);

    todayBtn.addEventListener('click', () => {
      const now = new Date();
      searchThisDate(pad(now.getMonth() + 1), pad(now.getDate()));
    });

    for (const btn of filterButtons) {
      btn.addEventListener('click', () => {
        currentFilter = btn.dataset.filter;
        updateControls();
        renderResults();
      });
    }

    copyBtn.addEventListener('click', () => {
      copyText(buildShareUrl(), copyBtn, '✔ Link copied!', COPY_LABEL);
    });

    loadFromUrl();
  </script>
  <script data-goatcounter="https://deaddates.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
